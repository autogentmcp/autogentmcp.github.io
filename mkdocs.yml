site_name: Autogent MCP Ecosystem Docs
site_url: https://autogentmcp.github.io/
nav:
  - Overview: index.md
  - MCP Portal: portal.md
  - MCP Registry Server: mcp-registry.md
  - Main Server: autogentmcp_server.md
  - MCP Core Java SDK: mcp-core-java.md
  - MCP Core Python SDK: mcp-core-python.md
  - MCP Core Node SDK: mcp-core-node.md
  - MCP Demo Apps: mcp-demo-apps.md
  - Ecosystem Diagrams: diagrams.md
  - Production Deployment: deployment.md
  - Contributing Guide: contributing.md
  - License Setup: license-setup.md
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - content.code.annotate
    - content.tabs.link
    - content.tabs.code
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.tasklist
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.magiclink
  - pymdownx.betterem
  - pymdownx.smartsymbols
  - pymdownx.progressbar
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/autogentmcp/docs
      name: GitHub

